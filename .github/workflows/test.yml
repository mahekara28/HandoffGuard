name: Handoff checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: node --check static/desk.js
      - run: python -m unittest -v test_workflow
